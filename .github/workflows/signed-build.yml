name: Signed iPhone build
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Registered Apple bundle identifier
        required: true
      team_id:
        description: Apple Developer Team ID
        required: true
      profile_name:
        description: Exact distribution profile name
        required: true
      export_method:
        description: Distribution method
        type: choice
        options: [app-store-connect, release-testing]
        default: app-store-connect
      upload_to_testflight:
        description: Upload to your existing App Store Connect app
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APP_BUNDLE_ID: ${{ inputs.bundle_id }}
      APP_TEAM_ID: ${{ inputs.team_id }}
      APP_PROFILE_NAME: ${{ inputs.profile_name }}
      APP_EXPORT_METHOD: ${{ inputs.export_method }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify domain tests
        run: node --test Tests/core.test.cjs
      - name: Install signing material
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64" && test -n "$BUILD_PROVISION_PROFILE_BASE64"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/mizani-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/mizani.mobileprovision"
      - name: Archive and export
        run: |
          xcodebuild archive -project Mizani.xcodeproj -scheme Mizani -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Mizani.xcarchive" PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" DEVELOPMENT_TEAM="$APP_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_NAME" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          python3 scripts/export-options.py "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Mizani.xcarchive" -exportPath build/ipa -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-Mizani-IPA
          path: build/ipa/*.ipa
          if-no-files-found: error
      - name: Locate exported IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight when requested
        if: inputs.upload_to_testflight && inputs.export_method == 'app-store-connect'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'
          uses-non-exempt-encryption: 'false'
          backend: AppStoreAPI
      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mizani-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/mizani.mobileprovision"
